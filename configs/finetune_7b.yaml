# OmniVLA (7B) の LoRA ファインチューニング (training/finetune_omnivla.py). RTX 3090/4090 (24GB) 以上
vla_path: /checkpoints/omnivla-original
base_step: -1
resume_from: ""

# --- data (tools/bag_to_dataset.py の出力) ---
data_dirs:
  - /data/dataset
val_ratio: 0.1
val_bags: ["20260919_150554"]    # 例 [run3] : この bag の走行を検証に使う. 数字の名前は引用符で ["20260919_150554"] (同じコースの別の走行で評価したい場合)
metric_waypoint_spacing: 0.0      # 0 = dataset_info.json の値 (1 フレームあたりの移動量) を使う
waypoint_spacing: 1
max_goal_dist: 30.0
image_goal_offset: [2, 30]        # ゴール画像は 2〜30 フレーム先 (サブゴール間隔 1m が入る範囲に)
pose_goal_offset: [2, 300]
modality_weights:                 # 画像ゴールのみで学習 (自己位置があれば image_pose / pose を足してもよい)
  image: 1.0
turn_sample_ratio: 0.5            # 曲がる場面を学習の 5 割で引く (コース走行は直進が多いため)
turn_threshold_deg: 45.0          # 曲がる場面の判定. データに合わせる: python3 tools/turn_stats.py /data/dataset
turn_horizon: 10
val_turn_ratio: 0.5
augment: true
crop_v: 0.1
crop_h: 0.05
flip_prob: 0.5
color_jitter: 0.2
num_workers: 6

# --- optimization ---
batch_size: 2
grad_accumulation_steps: 4        # 実効バッチ 8
max_steps: 5000
learning_rate: 1.0e-4
weight_decay: 0.01
lr_warmup_steps: 100
lr_decay_step: 4000
lr_decay_gamma: 0.1
max_grad_norm: 1.0
smooth_loss_weight: 0.1
gradient_checkpointing: true

# --- LoRA ---
lora_rank: 32
lora_dropout: 0.0
lora_target: all
train_heads: true

# --- logging / checkpoints ---
run_root: /runs
run_name: ""
log_freq: 10
val_freq: 500
val_batches: 50
val_at_start: true
num_viz: 8
save_freq: 1000
keep_last: 3
