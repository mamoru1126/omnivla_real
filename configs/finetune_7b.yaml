# OmniVLA (7B) の LoRA ファインチューニング (training/finetune_omnivla.py). RTX 3090/4090 (24GB) 以上
vla_path: /checkpoints/omnivla-original
base_step: -1
resume_from: ""

# --- data (tools/bag_to_dataset.py の出力) ---
data_dirs:
  - /data/dataset
val_ratio: 0.1
val_bags: ["20260919_150554"]    # 例 [run3] : この bag の走行を検証に使う. 数字の名前は引用符で ["20260919_150554"] (同じコースの別の走行で評価したい場合)
metric_waypoint_spacing: 0.0      # 0 = dataset_info.json の値 (1 フレームあたりの移動量) を使う
waypoint_spacing: 1
max_goal_dist: 30.0
image_goal_offset: [2, 30]        # (image_goal_dist_m が空のとき) ゴール画像は 2〜30 フレーム先
image_goal_dist_m: [0.5, 2.5]     # ゴール画像は道のりで 0.5〜2.5 m 先 (走行のサブゴールは topomap の 1 m 間隔で
                                  #   0.3〜1.5 m 先. 速さの違う bag を混ぜても同じ距離になる)
pose_goal_offset: [2, 300]
modality_weights:                 # 画像ゴールのみで学習 (自己位置があれば image_pose / pose を足してもよい)
  image: 1.0
label_smooth_sec: 0.3             # 正解 (この先の経路) を時間方向にならす [秒]. 手動操作でスティックを短く倒して曲がると
                                  #   いつ曲がるかが画像で決まらないため. ただし大きくすると曲がりの山も均されて
                                  #   「曲がる量の比」の上限が下がる (0.8 で 0.91, 0.3 で 0.98. 2026-10-24 の夜の学習で
                                  #   0.8 は取り分けた走行の比が 0.74 -> 0.70 と改善しなかった)
turn_sample_ratio: 0.5            # 曲がる場面を学習の 5 割で引く (コース走行は直進が多いため)
bag_weights: {}                   # bag ごとの引く倍率 (bag 名かその先頭部分). コースが変わったら新しい bag を多めに:
                                  #   {"manual_1024": 3.0}  (bag 名は python3 tools/turn_stats.py /data/dataset で確認)
turn_threshold_deg: 15.0          # 曲がる場面の判定. データに合わせる: python3 tools/turn_stats.py /data/dataset
turn_horizon: 10
val_turn_ratio: 0.5
augment: true
crop_v: 0.1
crop_h: 0.05
flip_prob: 0.5
color_jitter: 0.2
yaw_aug_deg: 5.0                  # 現在画像を左右にずらして「向きが最大 5 度ずれた」状態を作り、元の経路へ戻る正解で
                                  #   学習する (外れたら戻る). 0 で無し
yaw_aug_hfov_deg: 90.0            # カメラの実際の水平画角 [deg] (robot.yaml の camera.hfov_deg と同じ値にする)
num_workers: 6

# --- optimization ---
batch_size: 2
grad_accumulation_steps: 4        # 実効バッチ 8
max_steps: 5000
learning_rate: 1.0e-4
weight_decay: 0.01
lr_warmup_steps: 100
lr_decay_step: 4000
lr_decay_gamma: 0.1
max_grad_norm: 1.0
smooth_loss_weight: 0.1
gradient_checkpointing: true

# --- LoRA ---
lora_rank: 32
lora_dropout: 0.0
lora_target: all
train_heads: true

# --- logging / checkpoints ---
run_root: /runs
run_name: ""
log_freq: 10
val_freq: 500
val_batches: 50
val_at_start: true
num_viz: 8
save_freq: 1000
keep_last: 3
