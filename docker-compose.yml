# 学習・変換・机上評価用 (x86_64 + NVIDIA GPU). 実機 (Jetson) は docker-compose.jetson.yml
#   docker compose build
#   docker compose run --rm shell bash scripts/download_checkpoints.sh
#   docker compose run --rm shell python3 tools/bag_to_dataset.py --out /data/dataset /bags/run1
#   docker compose run --rm train_edge          # or train_7b
# ROS 1 で bag を再生して試す (実機と同じ 2 コンテナ構成):
#   docker compose up -d policy                 # 推論サーバ (NAV_MODEL / FINETUNED_DIR は .env)
#   docker compose run --rm ros1 bash scripts/replay_bag_ros1.sh /bags/run2.bag /data/topomaps/course_a
# 変数は .env (cp .env.example .env)
x-omnivla: &omnivla
  image: omnivla_real:latest
  build:
    context: .
    dockerfile: docker/Dockerfile
  network_mode: host
  ipc: host
  environment:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    HF_HOME: /root/.cache/huggingface
    DISPLAY: ${DISPLAY:-:0}
  volumes:
    - ./:/workspace
    - ${CHECKPOINT_DIR:-./checkpoints}:/checkpoints
    - ${DATA_DIR:-./data}:/data
    - ${BAG_DIR:-./bags}:/bags
    - ${RUNS_DIR:-./runs}:/runs
    - model-cache:/root/.cache
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
  working_dir: /workspace
  stdin_open: true
  tty: true
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  shell:
    <<: *omnivla
    command: bash
  train_edge:
    <<: *omnivla
    command: python3 training/finetune_edge.py --config ${EDGE_CONFIG:-configs/finetune_edge.yaml}
  train_7b:
    <<: *omnivla
    command: python3 training/finetune_omnivla.py --config ${TRAIN_7B_CONFIG:-configs/finetune_7b.yaml}
  policy:
    <<: *omnivla
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /root/.cache/huggingface
      OMNIVLA_SKIP_BUILD: "1"
      NAV_MODEL: ${NAV_MODEL:-}
      NAV_WEIGHTS: ${NAV_WEIGHTS:-}
      FINETUNED_DIR: ${FINETUNED_DIR:-}
      POLICY_PORT: ${POLICY_PORT:-8765}
    command:
      - bash
      - -c
      - >-
        exec python3 tools/policy_server.py --port $$POLICY_PORT
        $${NAV_MODEL:+--model $$NAV_MODEL} $${NAV_WEIGHTS:+--weights $$NAV_WEIGHTS}
        $${FINETUNED_DIR:+--finetuned_dir $$FINETUNED_DIR}
  ros1:
    image: omnivla_real:ros1
    build:
      context: .
      dockerfile: docker/Dockerfile.ros1
    network_mode: host
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI:-http://localhost:11311}
      POLICY_PORT: ${POLICY_PORT:-8765}
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - ./:/workspace
      - ${DATA_DIR:-./data}:/data
      - ${BAG_DIR:-./bags}:/bags
      - ${RUNS_DIR:-./runs}:/runs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    working_dir: /workspace
    stdin_open: true
    tty: true

volumes:
  model-cache:
