name: docker

# 学習用イメージ (x86_64, docker/Dockerfile) が作れるか (ビルドの後に、イメージの中で単体テスト).
# Jetson 用 (docker/Dockerfile.jetson) は arm64 + L4T なのでここでは作らない.
on:
  push:
    branches: [master]
    paths:
      - "docker/**"
      - "ros2/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /
      - uses: actions/checkout@v4
      - name: Build
        run: |
          set -o pipefail
          mkdir -p ci
          DOCKER_BUILDKIT=1 docker build --progress=plain -f docker/Dockerfile -t omnivla_real:ci . 2>&1 | tee ci/docker-build.log
      - name: Unit tests in the image (bin/setup.sh と同じ. 届かないプロキシを設定して社内ネットワークを真似る)
        run: |
          set -o pipefail
          docker run --rm -e http_proxy=http://10.255.255.1:3128 -e HTTP_PROXY=http://10.255.255.1:3128 \
            omnivla_real:ci python3 -m pytest -q tests 2>&1 | tee ci/pytest-image.log
      - name: Navigator launch file in the image
        run: |
          docker run --rm omnivla_real:ci bash -c \
            'source /opt/omnivla_ws/install/setup.bash && ros2 launch omnivla_real_ros navigator.launch.py --show-args' \
            2>&1 | tee ci/launch.log
      - name: Publish log to ci-logs-docker branch
        if: always()
        run: |
          D=/tmp/cilog; rm -rf $D; mkdir -p $D
          tail -n 400 ci/docker-build.log > $D/tail.log 2>/dev/null || echo "no log" > $D/tail.log
          grep -n -i -E "error|failed|conflict|cannot|not found" ci/docker-build.log | tail -200 > $D/errors.txt || true
          cp ci/launch.log $D/ 2>/dev/null || true
          echo "run=${{ github.run_id }} sha=${{ github.sha }} status=${{ job.status }}" > $D/info.txt
          cd $D && git init -q && git add . \
            && git -c user.name=ci -c user.email=ci@example.com commit -qm "docker ${{ github.run_id }}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-docker \
            && { [ "${{ job.status }}" = success ] || git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-docker-failed; }

  policy-image:
    # Jetson 用の推論サーバ (docker/Dockerfile.jetson) は arm64 + L4T なので、ここでは x86 の PyTorch イメージを
    # 代わりのベースにして、依存のインストール (7B 込み) と import が通るかだけを見る。
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
      - uses: actions/checkout@v4
      - name: Build (stand-in base image)
        run: |
          set -o pipefail
          mkdir -p ci
          DOCKER_BUILDKIT=1 docker build --progress=plain -f docker/Dockerfile.jetson \
            --build-arg BASE_IMAGE=pytorch/pytorch:2.2.2-cuda12.1-cudnn8-runtime -t omnivla_real:policy-ci . 2>&1 | tee ci/policy-build.log
      - name: Server starts (edge, random weights, CPU)
        run: |
          set -o pipefail
          docker run --rm --network host omnivla_real:policy-ci bash -c '
            python3 -c "import os, torch; from omnivla_real.edge import build_edge_model, EDGE_WEIGHTS; os.makedirs(\"/tmp/w\"); torch.save(build_edge_model().state_dict(), \"/tmp/w/\" + EDGE_WEIGHTS)"
            timeout 120 python3 tools/policy_server.py --model edge --weights /tmp/w --device cpu --port 8770 &
            for i in $(seq 100); do python3 -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8770/info\")" 2>/dev/null && break; sleep 1; done
            python3 -c "
          from omnivla_real.remote import RemotePolicy
          from PIL import Image
          p = RemotePolicy(\"http://127.0.0.1:8770\", wait=5)
          img = Image.new(\"RGB\", (320, 240), (90, 120, 150))
          p.push(img)
          out = p.predict(img, goal_image=img)
          print(\"waypoints\", out.waypoints.shape, \"latency\", round(out.latency, 3))
          "
          ' 2>&1 | tee ci/policy-run.log
      - name: Publish log to ci-logs-policy branch
        if: always()
        run: |
          D=/tmp/cilog; rm -rf $D; mkdir -p $D
          tail -n 300 ci/policy-build.log > $D/tail.log 2>/dev/null || echo "no log" > $D/tail.log
          grep -n -i -E "error|failed|conflict|cannot|not found" ci/policy-build.log | tail -200 > $D/errors.txt || true
          cp ci/policy-run.log $D/ 2>/dev/null || true
          echo "run=${{ github.run_id }} sha=${{ github.sha }} status=${{ job.status }}" > $D/info.txt
          cd $D && git init -q && git add . \
            && git -c user.name=ci -c user.email=ci@example.com commit -qm "policy ${{ github.run_id }}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-policy \
            && { [ "${{ job.status }}" = success ] || git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-policy-failed; }
