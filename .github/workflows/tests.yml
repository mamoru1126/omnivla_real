name: tests

# 合成した rosbag (ROS1 .bag / ROS2 sqlite3 / ROS2 mcap) で、変換 → 学習 (edge, CPU 数 step) → topomap →
# 机上評価 → ROS 1 / ROS 2 ノード (bag 再生で /cmd_vel と /omnivla/path が出るか) まで通しで確認する。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  TORCH_INDEX: https://download.pytorch.org/whl/cpu

jobs:
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Use the test configs (configs/ is tuned for the real robot; the synthetic bags need the defaults)
        run: cp tests/configs/robot.yaml tests/configs/navigator.yaml configs/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (CPU)
        run: |
          pip install torch==2.2.2 torchvision==0.17.2 --index-url $TORCH_INDEX
          pip install "numpy<2" pillow pyyaml matplotlib scipy pytest "rosbags>=0.10.4,<0.11" efficientnet_pytorch==0.7.1
      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p ci
          python -m pytest -q tests/test_core.py tests/test_bags.py tests/test_cpp.py 2>&1 | tee ci/pytest.log
      - name: bin/ scripts (dry run) and shellcheck
        run: |
          set -o pipefail
          shellcheck -S warning bin/*.sh bin/_lib.sh scripts/*.sh tests/*.sh docker/*.sh
          bash tests/bin_check.sh 2>&1 | tee ci/bin_check.log
      - name: End-to-end (bags -> dataset -> train edge -> topomap -> desk eval)
        run: |
          set -o pipefail
          bash tests/e2e_cli.sh "$RUNNER_TEMP/e2e" 2>&1 | tee ci/e2e.log
      - name: Keep inputs for the ROS node tests
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          retention-days: 3
          path: |
            ${{ runner.temp }}/e2e/bags
            ${{ runner.temp }}/e2e/topomap
            ${{ runner.temp }}/e2e/runs/edge_ci/checkpoints
      - name: Publish logs and reports to ci-logs-core branch
        if: always()
        run: |
          E=$RUNNER_TEMP/e2e
          D=/tmp/cilog; rm -rf $D; mkdir -p $D
          cp ci/*.log $D/ 2>/dev/null || true
          for d in check_odometry desk_eval_oracle desk_eval_oracle_loc desk_eval_edge topomap topomap_loc inspect; do
            [ -d $E/$d ] || continue
            mkdir -p $D/$d
            find $E/$d -maxdepth 1 \( -name "*.txt" -o -name "*.json" -o -name "*.png" -o -name "*.yaml" \) -exec cp {} $D/$d/ \;
          done
          [ -d $E/desk_eval_edge/debug ] && mkdir -p $D/desk_eval_edge/debug && cp $E/desk_eval_edge/debug/*.jpg $D/desk_eval_edge/debug/ 2>/dev/null || true
          cp $E/dataset/dataset_info.json $D/ 2>/dev/null || true
          cp -r $E/dataset/_reports $D/convert_reports 2>/dev/null || true
          echo "run=${{ github.run_id }} sha=${{ github.sha }} status=${{ job.status }}" > $D/info.txt
          cd $D && git init -q && git add . \
            && git -c user.name=ci -c user.email=ci@example.com commit -qm "core ${{ github.run_id }}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-core \
            && { [ "${{ job.status }}" = success ] || git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-core-failed; }

  ros2_node:
    needs: core
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    container: ros:humble-ros-base-jammy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Use the test configs (configs/ is tuned for the real robot; the synthetic bags need the defaults)
        run: cp tests/configs/robot.yaml tests/configs/navigator.yaml configs/
      - uses: actions/download-artifact@v4
        with:
          name: e2e
          path: /tmp/e2e
      - name: Install
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3-pip git
          pip3 install torch==2.2.2 torchvision==0.17.2 --index-url $TORCH_INDEX
          pip3 install "numpy<2" pillow pyyaml matplotlib efficientnet_pytorch==0.7.1
      - name: colcon build (Python node + C++ node)
        run: |
          source /opt/ros/humble/setup.bash
          # リンクにする (C++ のノードは ../../ros1/omnivla_real_ros1 の core を使う)
          mkdir -p /tmp/ws/src && ln -s "$PWD/ros2/omnivla_real_ros" "$PWD/ros2/omnivla_real_ros2" /tmp/ws/src/
          cd /tmp/ws && colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -30
          test -x /tmp/ws/install/omnivla_real_ros2/lib/omnivla_real_ros2/navigator
      - name: Node test (ros2 bag play -> /cmd_vel, /omnivla/path)
        run: |
          set -o pipefail
          source /opt/ros/humble/setup.bash && source /tmp/ws/install/setup.bash
          ls -R /tmp/e2e | head -30
          bash tests/ros_node_test.sh ros2 /tmp/e2e 2>&1 | tee /tmp/ros2_node.log
      - name: Analyze the navigation log (tools/plot_nav_log.py)
        run: python3 tools/plot_nav_log.py /tmp/e2e/ros2_node/nav/latest
      - name: C++ node test (policy server + ros2 bag play -> /cmd_vel, /omnivla/path, debug page)
        run: |
          set -o pipefail
          source /opt/ros/humble/setup.bash && source /tmp/ws/install/setup.bash
          mv /tmp/e2e/ros2_node /tmp/e2e/ros2_node_py
          CKPT=$(ls -d /tmp/e2e/runs/edge_ci/checkpoints/step_* | tail -1)
          nohup python3 tools/policy_server.py --model edge --weights "$CKPT" --device cpu --port 8765 > /tmp/policy_server.log 2>&1 &
          for i in $(seq 120); do python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/info')" 2>/dev/null && break; sleep 1; done
          NODE_IMPL=cpp POLICY_URL=http://127.0.0.1:8765 bash tests/ros_node_test.sh ros2 /tmp/e2e 2>&1 | tee /tmp/ros2_node_cpp.log
          python3 tools/plot_nav_log.py /tmp/e2e/ros2_node/nav/latest | tail -5
      - name: Launch files parse
        run: |
          source /opt/ros/humble/setup.bash && source /tmp/ws/install/setup.bash
          OMNIVLA_REAL_ROOT=$PWD ros2 launch omnivla_real_ros navigator.launch.py --show-args
          OMNIVLA_REAL_ROOT=$PWD ros2 launch omnivla_real_ros2 navigator.launch.py --show-args
      - name: Publish log to ci-logs-ros2 branch
        if: always()
        run: |
          git config --global --add safe.directory '*'
          D=/tmp/cilog; rm -rf $D; mkdir -p $D
          cp /tmp/ros2_node.log $D/ 2>/dev/null || echo "not run" > $D/ros2_node.log
          cp /tmp/ros2_node_cpp.log /tmp/policy_server.log $D/ 2>/dev/null || true
          cp -r /tmp/e2e/ros2_node $D/ 2>/dev/null || true
          cp -r /tmp/e2e/ros2_node_py $D/ 2>/dev/null || true
          rm -rf $D/ros2_node/nav/*/raw $D/ros2_node_py/nav/*/raw
          find $D -name "*.jpg" -size +200k -delete
          echo "run=${{ github.run_id }} sha=${{ github.sha }} status=${{ job.status }}" > $D/info.txt
          cd $D && git init -q && git add . \
            && git -c user.name=ci -c user.email=ci@example.com commit -qm "ros2 ${{ github.run_id }}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-ros2 \
            && { [ "${{ job.status }}" = success ] || git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-ros2-failed; }

  ros1_node:
    # 実機 (Jetson) と同じ構成: 推論サーバ (PyTorch, ここではホストの CPU) + ROS 1 コンテナ (docker/Dockerfile.ros1, torch なし)
    needs: core
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use the test configs (configs/ is tuned for the real robot; the synthetic bags need the defaults)
        run: cp tests/configs/robot.yaml tests/configs/navigator.yaml configs/
      - uses: actions/download-artifact@v4
        with:
          name: e2e
          path: /tmp/e2e
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install policy server deps (CPU)
        run: |
          pip install torch==2.2.2 torchvision==0.17.2 --index-url $TORCH_INDEX
          pip install "numpy<2" pillow pyyaml efficientnet_pytorch==0.7.1
      - name: Build ROS 1 image (docker/Dockerfile.ros1)
        run: |
          set -o pipefail
          mkdir -p ci
          docker build -f docker/Dockerfile.ros1 -t omnivla_real:ros1 . 2>&1 | tee ci/ros1-build.log | tail -20
      - name: Build ROS 2 image (docker/Dockerfile.ros2, Jetson で JETSON_ROS=ros2 のとき)
        run: |
          set -o pipefail
          docker build -f docker/Dockerfile.ros2 -t omnivla_real:ros2 . 2>&1 | tee ci/ros2-build.log | tail -20
          docker run --rm -v "$PWD":/workspace omnivla_real:ros2 bash -c \
            'ros2 pkg executables omnivla_real_ros2 && ros2 pkg executables omnivla_real_ros' 2>&1 | tee ci/ros2-image.log
          grep -q "omnivla_real_ros2 navigator" ci/ros2-image.log
          ! grep -q "C++ sources changed" ci/ros2-image.log   # イメージの中のビルドがそのまま使える
          docker compose -f docker-compose.jetson.yml -f docker-compose.jetson-ros2.yml --env-file .env.jetson config nav | grep -q "omnivla_real:ros2"
      - name: Start policy server
        run: |
          CKPT=$(ls -d /tmp/e2e/runs/edge_ci/checkpoints/step_* | tail -1)
          nohup python tools/policy_server.py --model edge --weights "$CKPT" --device cpu --port 8765 > ci/policy_server.log 2>&1 &
          for i in $(seq 120); do curl -sf http://127.0.0.1:8765/info > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/info; echo
      - name: C++ node test (rosbag play -> /cmd_vel, /omnivla/path, debug page)
        run: |
          set -o pipefail
          docker run --rm --network host -v "$PWD":/workspace -v /tmp/e2e:/tmp/e2e -e POLICY_URL=http://127.0.0.1:8765 \
            omnivla_real:ros1 bash tests/ros_node_test.sh ros1 /tmp/e2e 2>&1 | tee ci/ros1_node.log
      - name: Python node test (same, NODE_IMPL=py)
        run: |
          set -o pipefail
          sudo mv /tmp/e2e/ros1_node /tmp/e2e/ros1_node_cpp
          docker run --rm --network host -v "$PWD":/workspace -v /tmp/e2e:/tmp/e2e -e POLICY_URL=http://127.0.0.1:8765 \
            -e NODE_IMPL=py omnivla_real:ros1 bash tests/ros_node_test.sh ros1 /tmp/e2e 2>&1 | tee ci/ros1_node_py.log
          sudo mv /tmp/e2e/ros1_node /tmp/e2e/ros1_node_py && sudo mv /tmp/e2e/ros1_node_cpp /tmp/e2e/ros1_node
      - name: Analyze the navigation log (tools/plot_nav_log.py)
        run: |
          set -o pipefail
          docker run --rm -v "$PWD":/workspace -v /tmp/e2e:/tmp/e2e omnivla_real:ros1 \
            python3 tools/plot_nav_log.py /tmp/e2e/ros1_node/nav/latest 2>&1 | tee ci/plot_nav_log.log
      - name: docker-compose.replay.yml (Jetson と同じ nav コンテナ + bag をロボット代わり + ブラウザ)
        env:
          BAG_DIR: /tmp/e2e/bags
          DATA_DIR: /tmp/e2e
          RUNS_DIR: /tmp/e2e/runs_replay
          REPLAY_BAG: course_ros1_0.bag,course_ros1_1.bag
          TOPOMAP: /data/topomap
        run: |
          # policy はホストで動いているもの (Start policy server) を使う. GPU の policy コンテナは起動しない
          set -o pipefail
          C="docker compose -f docker-compose.replay.yml"
          $C config --services
          $C up -d --no-build roscore nav record robot
          ROBOT=$($C ps -a -q robot)
          WEB=0; python3 tests/web_check.py http://127.0.0.1:8080 150 > ci/replay_web_check.log 2>&1 || WEB=$?
          cat ci/replay_web_check.log
          RC=$(timeout 300 docker wait "$ROBOT" || echo timeout)
          $C stop
          $C logs --no-color > ci/replay_compose.log 2>&1
          $C down
          grep -E "\[robot\]|ready:|subgoal|finished|reached|ERROR|FATAL" ci/replay_compose.log | tail -40
          echo "web_check=$WEB robot=$RC"
          docker run --rm -v /tmp/e2e/runs_replay:/runs omnivla_real:ros1 python3 -c "
          import glob, rosbag
          f = sorted(glob.glob('/runs/replay/out_*.bag'))[-1]
          b = rosbag.Bag(f)
          n, p, s = (b.get_message_count(t) for t in ('/cmd_vel', '/omnivla/path', '/omnivla/status'))
          print(f, 'cmd_vel', n, 'path', p, 'status', s)
          assert n > 10 and p > 3 and s > 3
          " 2>&1 | tee ci/replay_bag.log
          docker run --rm -v "$PWD":/workspace -v /tmp/e2e/runs_replay:/runs omnivla_real:ros1 \
            python3 tools/plot_nav_log.py /runs/replay/nav/latest 2>&1 | tail -5
          [ "$WEB" = 0 ] && [ "$RC" = 0 ]
      - name: bin/replay_video.sh --log (デバッグ画面と同じ内容の動画を走行ログから作る)
        env:
          BAG_DIR: /tmp/e2e/bags
          DATA_DIR: /tmp/e2e
          RUNS_DIR: /tmp/e2e/runs_replay
        run: |
          set -o pipefail
          bin/replay_video.sh --log /runs/replay/nav/latest --out /runs/replay/video.mp4 --speed 4 2>&1 | tee ci/replay_video.log
          docker run --rm -v /tmp/e2e/runs_replay:/runs --entrypoint bash omnivla_real:ros1 -c '
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 /runs/replay/video.mp4); echo "duration $d s"
            python3 -c "import sys; assert float(sys.argv[1]) > 2" "$d"
            ffmpeg -v error -y -ss 2 -i /runs/replay/video.mp4 -frames:v 1 /runs/replay/video_frame.jpg' 2>&1 | tee -a ci/replay_video.log
      - name: Publish logs to ci-logs-ros1 branch
        if: always()
        run: |
          D=/tmp/cilog; rm -rf $D; mkdir -p $D
          cp ci/*.log $D/ 2>/dev/null || true
          sudo cp -r /tmp/e2e/ros1_node $D/ 2>/dev/null || true
          sudo cp -r /tmp/e2e/ros1_node_py $D/ 2>/dev/null || true
          sudo mkdir -p $D/replay
          sudo cp /tmp/e2e/runs_replay/replay/video_frame.jpg $D/replay/ 2>/dev/null || true
          sudo find /tmp/e2e/runs_replay/replay/nav -maxdepth 2 \( -name "*.png" -o -name "*.txt" -o -name "*.json" -o -name "*.csv" \) -exec cp {} $D/replay/ \; 2>/dev/null || true
          sudo chown -R $(id -u) $D
          find $D -name "*.jpg" -size +200k -delete
          rm -rf $D/ros1_node/nav/*/raw $D/ros1_node_py/nav/*/raw
          echo "run=${{ github.run_id }} sha=${{ github.sha }} status=${{ job.status }}" > $D/info.txt
          cd $D && git init -q && git add . \
            && git -c user.name=ci -c user.email=ci@example.com commit -qm "ros1 ${{ github.run_id }}" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-ros1 \
            && { [ "${{ job.status }}" = success ] || git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/ci-logs-ros1-failed; }
